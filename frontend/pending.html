<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pago Pendiente</title>
    <style>
        body {
            font-family: Arial;
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ffeaa7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏳ Pago Pendiente</h1>
        <p>Tu pago está siendo procesado.</p>
        <p>Te notificaremos cuando se complete.</p>
        <button onclick="volver()">Volver al formulario</button>
    </div>

    <script>
        function volver() {
            const urlParams = new URLSearchParams(window.location.search);
            const pack = urlParams.get('pack') || 'pack1';
            window.location.href = `/reserva.html?pack=${pack}`;
        }
    </script>
</body>
</html>
