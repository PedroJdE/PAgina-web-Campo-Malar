<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error en el Pago</title>
    <style>
        body {
            font-family: Arial;
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>❌ Error en el Pago</h1>
        <p>Hubo un problema al procesar tu pago.</p>
        <p>Por favor, intenta nuevamente.</p>
        <button onclick="volver()">Volver al formulario</button>
    </div>

    <script>
        function volver() {
            const urlParams = new URLSearchParams(window.location.search);
            const pack = urlParams.get('pack') || 'pack1';
            window.location.href = `/reserva.html?pack=${pack}`;
        }
    </script>
</body>
</html>
